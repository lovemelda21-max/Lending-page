<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penawaran Spesial</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1f4068 0%, #162447 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 30px;
            max-width: 400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        h1 {
            font-size: 22px;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            margin-bottom: 30px;
            opacity: 0.85;
            line-height: 1.5;
        }
        .btn {
            display: block;
            background-color: #e43f5a;
            color: white;
            padding: 15px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(228, 63, 90, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>💕WELCOME BABY💕</h1>
        <p> 👇👇👇 </p>
        
        <!-- Tombol Utama -->
        <a href="#" id="openBrowserBtn" class="btn">CONTINUE</a>
    </div>

    <script>
        document.getElementById('openBrowserBtn').addEventListener('click', function(e) {
            e.preventDefault();
            
            // Tautan tujuan Anda
            const targetUrl = "https://safeoffers.pro/a/82XZjfkKqF2YwQ"; 
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;

            // Deteksi apakah pengguna membuka dari Instagram / Facebook In-App Browser
            if (userAgent.indexOf('Instagram') > -1 || userAgent.indexOf('FBAN') > -1 || userAgent.indexOf('FBAV') > -1) {
                
                if (/android/i.test(userAgent)) {
                    // Trik untuk Android: Memaksa buka via Intent Chrome
                    window.location.href = "intent://" + targetUrl.replace(/^https?:\/\//, '') + "#Intent;scheme=https;package=com.android.chrome;end;";
                } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                    // Trik untuk iOS / iPhone: Memberikan instruksi titik tiga (⋯) karena pembatasan ketat Safari
                    alert("Silakan ketuk ikon titik tiga (⋯) di pojok kanan atas, lalu pilih 'Buka di Browser' untuk melanjutkan.");
                    window.location.href = targetUrl;
                } else {
                    window.location.href = targetUrl;
                }
            } else {
                // Jika sudah di browser biasa (Chrome/Safari), langsung buka link
                window.location.href = targetUrl;
            }
        });
    </script>

</body>
</html>
